kind = "web"
previewPath = "/"
title = "HyperSoft"
version = "1.0.0"
id = "artifacts/hypersoft"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18489

[services.development]
run = "pnpm --filter @workspace/hypersoft run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hypersoft", "run", "build" ]
publicDir = "artifacts/hypersoft/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18489"
BASE_PATH = "/"
